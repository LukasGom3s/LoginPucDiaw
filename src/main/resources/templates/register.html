<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="icon" type="image/png" th:href="@{/images/iconesite.jpg}">
</head>
<body>
    <div class="login-wrapper">
        
        <!-- Lado Esquerdo: Formulário de Cadastro -->
        <div class="form-panel">
            <div class="form-box">
                <h2 class="login-title">Cadastre-se</h2>
                <p class="login-subtitle">Crie sua conta para começar</p>
                
                <form th:action="@{/register}" method="post">
                    
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm_password">Confirmar Senha</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>

                    <div class="login-button-container">
                        <button type="submit">Cadastrar</button>
                    </div>

                    <div class="login-redirect-options">
                        <p>Já possui uma conta? <a th:href="@{/login}">Entrar</a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lado Direito: Imagem -->
        <div class="image-panel">
            <img th:src="@{/images/imagem-lampada.avif}" alt="Energia Sustentável" class="bg-image">
        </div>

    </div>
</body>
</html>
